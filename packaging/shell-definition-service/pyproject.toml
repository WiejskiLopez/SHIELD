[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "shell-definition-service"
version = "0.1.0"
description = "SHELL Definition bounded context service"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.18.5",
    "dependency-injector>=4.49.1",
    "fastapi>=0.139.0",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.51",
    "shell-platform>=0.1.0,<0.2.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shell.definition_service*"]

[tool.uv.sources]
shell-platform = { path = "../shell-platform" }

[tool.setuptools.package-data]
"shell.definition_service.bootstrap.definition" = ["config/*.yaml"]
"shell.definition_service.migrations" = ["script.py.mako"]
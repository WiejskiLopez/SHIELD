[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "shell-certificates"
version = "0.1.0"
description = "Shared static mTLS certificate generator for SHELL research services"
requires-python = ">=3.14,<3.15"
dependencies = ["cryptography>=46.0.0"]

[tool.setuptools.packages.find]
where = ["../.."]
include = ["shell.certificates*"]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "saga-orchestration"
version = "0.1.0"
description = "Generic saga orchestration contracts and process manager"
requires-python = ">=3.14,<3.15"
dependencies = [
	"alembic>=1.18.5",
	"sqlalchemy>=2.0.51",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["saga_orchestration*"]

[pytest]
asyncio_mode = auto
testpaths = shell/tests
addopts = -ra -q --strict-markers
markers =
    unit: fast unit tests, no external dependencies
    integration: tests requiring database or external services
    e2e: end-to-end tests via API or CLI
filterwarnings =
    # Accepted (documented in ref4.md Krok 7): per-BC dynamic model factories
    # (build_*_model) intentionally reuse class names across separate metadata
    # registries. SQLAlchemy warns about the string-lookup-table name clash, but
    # the classes are always used by direct reference, never by string lookup.
    ignore:This declarative base already contains a class with the same class name and module name.*:sqlalchemy.exc.SAWarning
